services:

  frontend:
    build: ./client
    container_name: task-manager-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./server
    container_name: task-manager-server1
    restart: unless-stopped
    environment:
      INSTANCE_NAME: backend1
    expose:
      - "5000"
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend2:
    build: ./server
    container_name: task-manager-server2
    restart: unless-stopped
    environment:
      INSTANCE_NAME: backend2
    expose:
      - "5000"
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:8.0
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - task-manager-mongo-data:/data/db

  nginx:
    build: ./nginx
    container_name: task-manager-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend1
      - backend2

volumes:
  task-manager-mongo-data:

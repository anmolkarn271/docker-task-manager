services:

  frontend:
    build: ./client
    container_name: task-manager-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./server
    container_name: task-manager-server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    container_name: task-manager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - task-manager-mongo-data:/data/db

volumes:
  task-manager-mongo-data:
